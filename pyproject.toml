[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencetrust-java"
version = "0.1.0"
description = "Representation-aware reliability for Java vulnerability detection"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["evidencetrust*"]